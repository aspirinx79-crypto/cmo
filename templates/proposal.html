<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>제안서</title>
  <style>
    @font-face {
      font-family: "Pretendard";
      src: url("../app/fonts/PretendardVariable.woff2") format("woff2-variations");
      font-weight: 100 900; font-display: block;
    }
    @page { size: A4 portrait; margin: 16mm 14mm; }
    * { box-sizing: border-box; }
    body { font-family: "Pretendard", sans-serif; color: #14181f; font-size: 11pt; margin: 0; }
    section { page-break-after: always; }
    section:last-child { page-break-after: auto; }
    h1 { font-size: 26pt; margin: 0 0 6mm; }
    h2 { font-size: 15pt; border-bottom: 2px solid #3E8AFF; padding-bottom: 2mm; margin: 0 0 5mm; }
    .cover { height: 240mm; display: flex; flex-direction: column; justify-content: center; }
    .cover .month { color: #3E8AFF; font-size: 14pt; font-weight: 700; }
    .cover .company { margin-top: 20mm; color: #6b7280; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 3mm 2mm; text-align: left; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr.total td { font-weight: 800; border-top: 2px solid #14181f; border-bottom: none; }
    .headline { margin-top: 6mm; padding: 5mm; background: #eef4ff;
                border-left: 4px solid #3E8AFF; font-size: 14pt; font-weight: 800; }
    /* 오픈업 카드 세 장이 더해지면서 한 줄에 다 담기지 않는다.
       줄바꿈을 막으면 카드가 눌려 숫자가 두 줄로 접힌다. */
    .metrics { display: flex; flex-wrap: wrap; gap: 6mm; margin: 5mm 0; }
    .metric { flex: 1 1 28%; padding: 4mm; background: #f8fafc; border-radius: 3mm; }
    .metric .label { color: #6b7280; font-size: 9pt; }
    .metric .value { font-size: 18pt; font-weight: 800; }
    /* 오픈업 값은 「남성 20대 26%」처럼 글자가 길다. 18pt 로는 카드 안에서
       잘린다. 보조 정보라 한 단계 작게 찍고 대신 한 줄에 담는다. */
    .metric .value.small { font-size: 12pt; white-space: nowrap; }
    .note { font-size: 8pt; color: #6b7280; margin: 1mm 0 0; }
    h3 { font-size: 12pt; margin: 6mm 0 2mm; }
    .move { display: flex; gap: 3mm; padding: 1mm 0; }
    .move .arrow { width: 5mm; font-weight: 800; }
    .move .kw { width: 55mm; }
    .down { color: #dc2626; }
    .up { color: #2563eb; }
    ul { margin: 0; padding-left: 5mm; }
    li { margin-bottom: 2mm; }
    .week { margin-bottom: 4mm; }
    .week h3 { margin: 0 0 1mm; font-size: 11pt; color: #3E8AFF; }
    .fine { color: #6b7280; font-size: 9pt; }
  </style>
</head>
<body>
  <section class="cover">
    <div class="month" id="c-month"></div>
    <h1 id="c-name"></h1>
    <div id="c-where"></div>
    <div class="company">
      (주)상생어벤져스컴퍼니 · SSAvengers Group<br>
      서울특별시 강남구 압구정로2길 60, MG타워 6F · 1551-0723
    </div>
  </section>

  <section id="s-customer" hidden>
    <h2>이 가게에 오는 손님</h2>
    <div id="d-basic"></div>
    <div class="metrics" id="d-customer"></div>
    <p id="d-trade"></p>
    <p id="d-metrics-note" class="note"></p>
  </section>

  <section id="s-search" hidden>
    <h2>검색에서의 자리</h2>
    <div class="headline" id="d-headline"></div>
    <div class="metrics" id="d-numbers"></div>

    <div id="d-opportunity-wrap">
      <h3>키워드 기회표</h3>
      <table>
        <thead><tr><th>키워드</th><th class="num">월 검색</th>
                   <th class="num">지금</th></tr></thead>
        <tbody id="d-opportunity"></tbody>
      </table>
    </div>

    <div id="d-hidden-wrap">
      <h3 id="d-hidden-title"></h3>
      <p class="fine" id="d-hidden"></p>
    </div>
  </section>

  <section id="s-prescription" hidden>
    <h2 id="d-moves-title">순위 변동과 이번 달 처방</h2>

    <div id="d-up-wrap">
      <h3>▲ 순위가 오르는 중</h3>
      <div id="d-up"></div>
      <p id="d-up-line"></p>
      <p class="fine" id="d-up-place"></p>
    </div>

    <div id="d-down-wrap">
      <h3>▼ 순위가 내려간 키워드</h3>
      <div id="d-down"></div>
      <p id="d-down-line"></p>
      <p class="fine" id="d-down-place"></p>
    </div>

    <div id="d-reviews-wrap">
      <h3>리뷰 현황</h3>
      <p id="d-review-counts"></p>
      <ul id="d-review-list"></ul>
    </div>
  </section>

  <section>
    <h2>실행 구성</h2>
    <table>
      <thead><tr><th>매체</th><th>항목</th><th>수량</th><th class="num">정가</th></tr></thead>
      <tbody id="t-body"></tbody>
    </table>
    <div class="headline" id="t-headline"></div>
  </section>

  <section>
    <h2>1개월차 실행 일정</h2>
    <div id="s-weeks"></div>
  </section>

  <section>
    <h2>저희가 다른 점</h2>
    <ul id="x-list"></ul>
  </section>

  <script src="../app/util.js"></script>
  <script>
    // build_pdf.py 가 window.PAYLOAD 를 주입한 뒤 render() 를 부른다
    function render() {
      const P = window.PAYLOAD;
      const esc = window.Util.escapeHtml;
      const won = (n) => Number(n || 0).toLocaleString() + "원";

      document.getElementById("c-month").textContent = P.월 + " 마케팅 제안";
      document.getElementById("c-name").textContent = P.매장명;
      document.getElementById("c-where").textContent = [P.지역, P.업종].filter(Boolean).join(" · ");

      document.getElementById("t-body").innerHTML =
        P.구성.map((c) =>
          `<tr><td>${esc(c.매체)}</td><td>${esc(c.상품명)}</td><td>${esc(c.수량표시)}</td>
           <td class="num">${won(c.정가)}</td></tr>`).join("") +
        `<tr class="total"><td colspan="3">정가 합계</td>
         <td class="num">${won(P.정가합)}</td></tr>` +
        `<tr class="total"><td colspan="3">월 계약가</td>
         <td class="num">${won(P.계약가)}</td></tr>`;

      document.getElementById("t-headline").textContent = P.혜택배율문구;

      document.getElementById("s-weeks").innerHTML = P.일정.map((w) =>
        `<div class="week"><h3>${esc(w.주차)}주차</h3>
         <ul>${(w.항목.length ? w.항목 : ["—"]).map((i) => `<li>${esc(i)}</li>`).join("")}</ul></div>`
      ).join("");

      // 진단 세 장 — 값이 없는 장은 통째로 감춘다. 빈 표를 만들면
      // 「자료를 못 구했다」가 「그런 게 없다」로 읽힌다.
      const D = P.진단자료 || {};
      const 보임 = (id, on) => { document.getElementById(id).hidden = !on; };
      const 카드 = (list) => list.map((c) =>
        `<div class="metric"><div class="label">${esc(c.label ?? c.이름)}</div>
         <div class="value${c.small ? " small" : ""}">${esc(c.value ?? c.값)}</div>
         </div>`).join("");

      // ── 1장 손님
      const U = D.손님;
      보임("s-customer", Boolean(U));
      if (U) {
        document.getElementById("d-basic").textContent =
          [P.업종, P.지역, P.평수 ? P.평수 + "평" : null].filter(Boolean).join(" · ");
        const 만 = (n) => Math.round(n / 10000).toLocaleString();
        const cards = [];
        if (U.매출) cards.push({ label: "월 추정매출", small: true,
          value: 만(U.매출.하한) + "~" + 만(U.매출.상한) + "만원" });
        if (U.성별최다) cards.push({ label: "주 고객", small: true,
          value: U.성별최다.값 + " " + U.성별최다.비율 + "%" });
        if (U.연령최다) cards.push({ label: "최다 연령", small: true,
          value: U.연령최다.값 + " " + U.연령최다.비율 + "%" });
        if (U.요일최다 || U.시간대최다) cards.push({ label: "붐비는 때", small: true,
          value: [U.요일최다 ? U.요일최다.값 + " " + U.요일최다.비율 + "%" : null,
                  U.시간대최다 ? U.시간대최다.값 + " " + U.시간대최다.비율 + "%" : null]
                 .filter(Boolean).join(" · ") });
        document.getElementById("d-customer").innerHTML = 카드(cards);

        const 상권 = document.getElementById("d-trade");
        const 비율 = (U.평일비율 === null || U.평일비율 === undefined) ? null
          : `평일 ${U.평일비율}% · 주말 ${100 - U.평일비율}%`;
        상권.textContent = [비율, U.상권].filter(Boolean).join(" — ");
        상권.hidden = !상권.textContent;

        const [연, 월] = (U.기준월 || "-").split("-");
        document.getElementById("d-metrics-note").textContent =
          `매출·고객 구성은 오픈업 추정(${연}년 ${Number(월)}월)`;
      }

      // ── 2장 검색
      const S = D.검색 || {};
      보임("s-search", Boolean(S.헤드라인 || (S.수치 || []).length ||
                                S.기회표 || S.히든키워드));
      document.getElementById("d-headline").textContent = S.헤드라인 || "";
      보임("d-headline", Boolean(S.헤드라인));
      document.getElementById("d-numbers").innerHTML = 카드(S.수치 || []);

      보임("d-opportunity-wrap", Boolean(S.기회표));
      if (S.기회표) {
        document.getElementById("d-opportunity").innerHTML = S.기회표.map((r) =>
          `<tr><td>${esc(r.키워드)}</td>
           <td class="num">${Number(r.조회수).toLocaleString()}건</td>
           <td class="num">${esc(r.순위표시)}</td></tr>`).join("");
      }

      보임("d-hidden-wrap", Boolean(S.히든키워드));
      if (S.히든키워드) {
        document.getElementById("d-hidden-title").textContent =
          `아직 안 잡은 키워드 ${S.히든키워드.개수}개`;
        document.getElementById("d-hidden").textContent =
          S.히든키워드.목록.join(" · ");
      }

      // ── 3장 처방
      const R = D.처방;
      보임("s-prescription", Boolean(R || D.리뷰));
      const 줄 = (r, cls, mark) =>
        `<div class="move ${cls}"><span class="arrow">${mark}</span>` +
        `<span class="kw">${esc(r.키워드)}</span>` +
        `<span>${esc(r.전)} → ${esc(r.후)}</span></div>`;
      // 날짜를 못 읽은 날 「(null → null)」 이 사장님께 나갔다.
      const 기간 = (R && R.비교일 && R.기준일) ? ` (${R.비교일} → ${R.기준일})` : "";
      document.getElementById("d-moves-title").textContent =
        `순위 변동과 이번 달 처방${기간}`;

      const 한쪽 = (있나, wrapId, listId, lineId, placeId, rows, line, place, cls, mark) => {
        보임(wrapId, 있나);
        if (!있나) return;
        document.getElementById(listId).innerHTML =
          rows.map((r) => 줄(r, cls, mark)).join("");
        document.getElementById(lineId).textContent = line || "";
        // 빈 약속을 만들지 않는다 — 배치가 없으면 줄이 통째로 사라진다.
        const p = document.getElementById(placeId);
        p.textContent = place.length ? `이번 달 배치 — ${place.join(" · ")}` : "";
        p.hidden = !place.length;
      };
      한쪽(Boolean(R && R.오름.length), "d-up-wrap", "d-up", "d-up-line",
           "d-up-place", R ? R.오름 : [], R && R.오름문장,
           R ? R.오름배치 : [], "up", "▲");
      한쪽(Boolean(R && R.내림.length), "d-down-wrap", "d-down", "d-down-line",
           "d-down-place", R ? R.내림 : [], R && R.내림문장,
           R ? R.내림배치 : [], "down", "▼");

      보임("d-reviews-wrap", Boolean(D.리뷰));
      if (D.리뷰) {
        document.getElementById("d-review-counts").textContent =
          `방문자 리뷰 ${Number(D.리뷰.방문자수 || 0).toLocaleString()}건 · ` +
          `블로그 리뷰 ${Number(D.리뷰.블로그수 || 0).toLocaleString()}건`;
        document.getElementById("d-review-list").innerHTML =
          D.리뷰.많이읽힌.map((r) =>
            `<li>${esc(r.제목)} — ${Number(r.조회수).toLocaleString()}회 읽힘</li>`
          ).join("");
      }

      document.getElementById("x-list").innerHTML =
        P.차별점.map((n) => `<li>${esc(n)}</li>`).join("");
    }
  </script>
</body>
</html>
