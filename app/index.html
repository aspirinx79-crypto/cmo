<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>CMO 기획 도구</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header id="topbar">
    <select id="client-select"><option value="">고객사 선택…</option></select>
    <input id="month" type="month" value="2026-09">
    <label class="contract">계약가(월)
      <input id="contract-price" type="number" step="10000" value="1000000">
    </label>
    <button id="new-client" type="button">+ 새 매장</button>
    <button id="edit-client" type="button">매장 정보</button>
    <span id="warnings"></span>
  </header>

  <main>
    <section id="drawer">
      <input id="search" type="search" placeholder="상품 검색">
      <div id="drawer-list"></div>
    </section>

    <section id="board">
      <div id="preset-bar">
        <select id="preset-select"><option value="">프리셋 불러오기…</option></select>
      </div>
      <div id="board-list"></div>
    </section>

    <section id="summary">
      <dl id="public-figures">
        <dt>제안 정가 합계</dt><dd id="list-total">0</dd>
        <dt>계약가(월)</dt><dd id="contract-total">0</dd>
      </dl>
      <p id="multiplier">—</p>

      <div id="internal">
        <div class="internal-head">
          <span>내부전용</span>
          <button id="hide-internal" type="button">가리기</button>
        </div>
        <dl>
          <dt>실비 합계</dt><dd id="cost-total">0</dd>
          <dt>마진</dt><dd id="margin">0</dd>
          <dt>마진율</dt><dd id="margin-rate">—</dd>
        </dl>
      </div>

      <div id="actions">
        <button id="save-plan" type="button">저장</button>
        <button id="copy-next" type="button">다음 달로 복제</button>
        <button id="make-proposal" type="button">제안서 만들기</button>
        <button id="make-quote" type="button">견적서 만들기</button>
        <label class="quote-opt"><input id="quote-vat-out" type="checkbox"> 부가세 별도</label>
        <label class="quote-opt"><input id="quote-detail" type="checkbox" checked> 내역 펼치기</label>
      </div>
    </section>
  </main>

  <div id="client-panel" hidden>
    <div class="panel-box">
      <div class="panel-head">
        <h2 id="panel-title">새 매장</h2>
        <button id="panel-hide-internal" type="button">가리기</button>
        <button id="panel-close" type="button" aria-label="닫기">×</button>
      </div>

      <form id="client-form" novalidate>
        <label>이름 <input id="f-name" required></label>
        <label>플레이스URL <input id="f-place-url"></label>
        <label>업종 <input id="f-category"></label>
        <label>지역 <input id="f-area"></label>
        <label>평수 <input id="f-size" type="number" min="0"></label>
        <label>객단가 <input id="f-ticket" type="number" min="0" step="1000"></label>
        <label>계약시작 <input id="f-start" type="month"></label>
        <label>상태
          <select id="f-status">
            <option>진행중</option>
            <option>종료</option>
          </select>
        </label>
        <label>메모 <textarea id="f-memo" rows="3"></textarea></label>
        <div class="keyword-box">
          <label>추적키워드 <input id="f-keyword"></label>
          <button id="add-keyword" type="button">추가</button>
          <ul id="keyword-list"></ul>
        </div>
        <p id="client-msg"></p>
        <button id="save-client" type="submit">저장</button>
      </form>

      <fieldset id="adlog" disabled>
        <legend>애드로그 연결</legend>
        <p id="adlog-linked">연결 안 됨</p>
        <button id="adlog-find" type="button">애드로그에서 찾기</button>
        <button id="adlog-refresh" type="button">목록 새로고침</button>
        <select id="adlog-candidates" hidden size="8"></select>
        <button id="adlog-link" type="button" hidden>이 매장으로 잇기</button>
        <p id="adlog-msg"></p>
        <button id="adlog-sync" type="button" disabled>순위 갱신</button>
      </fieldset>

      <fieldset id="doc" disabled>
        <legend>자료 넣기</legend>
        <label>애드로그 화면 (여러 장)
          <input id="doc-file" type="file" accept=".pdf,image/*" multiple>
        </label>
        <p id="doc-msg"></p>
        <p id="doc-warn"></p>
        <div id="doc-result"></div>
        <button id="apply-doc" type="button" disabled>판독값 저장</button>
      </fieldset>

      <fieldset id="openub" disabled>
        <legend>오픈업 캡처 넣기</legend>
        <label>오픈업 화면 캡처 (여러 장)
          <input id="openub-file" type="file" accept="image/*" multiple>
        </label>
        <p id="openub-msg"></p>
        <div id="openub-result"></div>
        <button id="apply-openub" type="button" disabled>판독값 저장</button>
      </fieldset>

      <fieldset id="metrics" disabled>
        <legend>지표</legend>
        <label class="checkbox">
          <input id="f-fetch-place" type="checkbox">
          플레이스 직접 긁기 (15초쯤 걸립니다 — 애드로그가 안 될 때만)
        </label>
        <div id="rank-rows"></div>
        <label>월매출 <input id="f-revenue" type="number" class="manual-cost"></label>
        <p id="metrics-msg"></p>
        <button id="save-metrics" type="button">지표 저장</button>
        <p id="last-snapshot">—</p>
      </fieldset>
    </div>
  </div>

  <script src="util.js"></script>
  <script src="api.js"></script>
  <script src="drawer.js"></script>
  <script src="board.js"></script>
  <script src="summary.js"></script>
  <script src="client.js"></script>
</body>
</html>
